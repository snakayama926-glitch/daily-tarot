<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のやらない方がいいこと占い</title>
<meta name="description" content="タロットを1枚引いて、今日ひとつ手放すことを見つける無料占い。">
<meta property="og:title" content="今日のやらない方がいいこと占い">
<meta property="og:description" content="タロットを1枚引いて、今日ひとつ手放すことを見つけよう。">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px;
    background: radial-gradient(ellipse at top, #392344, #161223 70%);
    color: #fff5e3; font: 1rem/1.8 system-ui, sans-serif; text-align: center;
  }
  main { width: min(100%, 540px); }
  h1, h2 { line-height: 1.4; margin: .3em 0; }
  h1 { font-size: clamp(1.45rem, 5vw, 2.2rem); }
  .eyebrow, .card { color: #f4ce8e; letter-spacing: .18em; }
  .card {
    display: grid; place-content: center; gap: 4px; width: 158px; height: 220px;
    margin: 24px auto; border: 4px double #d9b579; border-radius: 16px; padding: 10px;
    background: radial-gradient(circle, #50365e, #21182f 75%);
  }
  #symbol { font-size: 3.4rem; line-height: 1.2; }
  button {
    font: inherit; font-weight: bold; color: #211529; background: #f4ce8e;
    border: 0; border-radius: 100px; padding: 10px 28px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  #result:not(:empty) {
    margin: 20px 0; padding: 14px 20px; background: #30243d;
    border: 1px solid #775c81; border-radius: 16px;
  }
  footer, #date { color: #ded0e3; font-size: .85rem; }
  footer { margin-top: 20px; }
</style>
<main>
  <p class="eyebrow">✦ ONE CARD TAROT ✦</p>
  <h1>今日のやらない方がいいこと占い</h1>
  <p>タロットを1枚引いて、今日ひとつ手放すことを見つけよう。</p>
  <p id="date"></p>
  <div class="card" aria-hidden="true"><span id="symbol">✦</span><span id="card-label">TAROT</span></div>
  <button id="draw" type="button">今日のカードを引く</button>
  <section id="result" aria-live="polite" aria-atomic="true"></section>
  <noscript>占いを遊ぶにはブラウザーのJavaScriptを有効にしてください。</noscript>
  <footer>気分転換に楽しむ、1日1枚のミニ占い。</footer>
</main>
<script>
  // カード名、シンボル、今日控えること、小さなヒント
  const cards = [
    ["愚者", "☆", "勢いだけで約束する", "返事をする前に、予定をひとつ確認してみよう。"],
    ["魔術師", "✧", "道具がそろうまで待つ", "手元にあるもので、最初の一歩を試してみよう。"],
    ["女教皇", "☾", "沈黙を無理に埋める", "少し間を置くと、自分の言いたいことが見えてくるかも。"],
    ["女帝", "❀", "休憩を後回しにする", "温かい飲み物を用意して、ひと息つこう。"],
    ["皇帝", "♜", "全部ひとりで仕切る", "任せられそうなことをひとつ見つけよう。"],
    ["恋人", "♡", "相手に合わせて即答する", "「少し考えてみる」と伝えて、自分の気持ちも聞いてみよう。"],
    ["戦車", "↗", "予定を詰め込みすぎる", "いちばん大切な用事の前後に、余白をつくろう。"],
    ["隠者", "✺", "人のペースと比べる", "昨日より少し進んだことをひとつ思い出してみよう。"],
    ["節制", "≈", "一気に生活を変える", "続けやすそうな小さな工夫から始めよう。"],
    ["塔", "ϟ", "崩れた予定を全部立て直す", "今日必要なことだけ拾って、残りは明日考えよう。"],
    ["星", "✷", "小さな進歩を見過ごす", "できたことをひとつだけ書き留めよう。"],
    ["月", "☽", "曖昧な返事を深読みする", "気になることは、落ち着いてひとつだけ聞いてみよう。"]
  ];

  const dateLabel = document.querySelector("#date");
  const drawButton = document.querySelector("#draw");
  const result = document.querySelector("#result");
  let currentDay;
  let currentIndex;

  function showDate(now) {
    dateLabel.textContent = now.toLocaleDateString("ja-JP", { dateStyle: "full" });
  }

  showDate(new Date());
  drawButton.addEventListener("click", () => {
    const now = new Date();
    const day = [now.getFullYear(), now.getMonth() + 1, now.getDate()].join("-");
    const key = "tarot-daily-v1";
    showDate(now);
    if (currentDay !== day) {
      currentDay = day;
      currentIndex = Math.floor(Math.random() * cards.length);
      // 保存が使えない環境でも、開いているページ内では同じ結果を表示する。
      try {
        const saved = JSON.parse(localStorage.getItem(key));
        if (saved?.day === day && Number.isInteger(saved.index) && cards[saved.index]) {
          currentIndex = saved.index;
        } else {
          localStorage.setItem(key, JSON.stringify({ day, index: currentIndex }));
        }
      } catch {}
    }

    const [name, symbol, avoid, hint] = cards[currentIndex];
    document.querySelector("#symbol").textContent = symbol;
    document.querySelector("#card-label").textContent = name;
    const cardName = document.createElement("p");
    cardName.textContent = "今日のカードは「" + name + "」";
    const title = document.createElement("h2");
    title.textContent = avoid;
    const tip = document.createElement("p");
    tip.textContent = hint;
    result.replaceChildren(cardName, title, tip);
    drawButton.textContent = "今日のカードを確認する";
  });
</script>
</html>
